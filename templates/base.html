<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Menu Manager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons (optional but nice) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Your custom overrides (keep small) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="fas fa-utensils me-2"></i>Cafeteria Manager БАНАНА ЛИФ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
    <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="{{ url_for('dishes') }}">Dishes</a></li>
    <li class="nav-item"><a class="nav-link" href="{{ url_for('stats') }}">Stats</a></li>
    <li class="nav-item"><a class="nav-link" href="{{ url_for('edit_today_menu') }}">Today's Menu</a></li>
    <li class="nav-item"><a class="nav-link" href="{{ url_for('edit_complex_today') }}">Complex Lunch</a></li>
    
    <!-- Dropdown for additional features -->
    <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            More
        </a>
        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" href="{{ url_for('checklist') }}"><i class="fas fa-check-square me-1"></i>Checklist</a></li>
            <li><a class="dropdown-item" href="{{ url_for('notes_list') }}"><i class="fas fa-sticky-note me-1"></i>Notes</a></li>
            <li><a class="dropdown-item" href="{{ url_for('bakery') }}"><i class="fas fa-chart-simple me-1"></i>Bakery</a></li>
            <li><a class="dropdown-item" href="{{ url_for('supplies') }}"><i class="fas fa-boxes me-1"></i>Supplies</a></li>
            <li><a class="dropdown-item" href="{{ url_for('reminders') }}"><i class="fas fa-bell me-1"></i>Reminders</a></li>
        </ul>
    </li>
</ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS bundle (for toggling navbar on mobile) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

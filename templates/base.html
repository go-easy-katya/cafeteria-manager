<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Leaf Cafeteria Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">
                <i class="fas fa-leaf me-2" style="color: #E67E22;"></i> Banana Leaf Cafeteria
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dishes">Dishes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('stats') }}">Stats</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('edit_today_menu') }}">Today's Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('edit_complex_today') }}">Complex Lunch</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">More</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{{ url_for('checklist') }}"><i class="fas fa-check-square me-1"></i>Checklist</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('notes_list') }}"><i class="fas fa-sticky-note me-1"></i>Notes</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('bakery') }}"><i class="fas fa-chart-simple me-1"></i>Bakery</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('supplies') }}"><i class="fas fa-boxes me-1"></i>Supplies</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('reminders') }}"><i class="fas fa-bell me-1"></i>Reminders</a></li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link theme-toggle" id="darkModeToggle">
                            <i class="fas fa-moon"></i> <span id="toggleText">Dark</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light" href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt me-1"></i>Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center mt-5 py-3">
        <p class="mb-0">made by go-easy-katya</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toggle = document.getElementById('darkModeToggle');
        const toggleText = document.getElementById('toggleText');
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            if (toggleText) toggleText.innerText = 'Light';
        }
        if (toggle) {
            toggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                if (document.body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                    if (toggleText) toggleText.innerText = 'Light';
                } else {
                    localStorage.setItem('theme', 'light');
                    if (toggleText) toggleText.innerText = 'Dark';
                }
            });
        }
    </script>
</body>
</html>
